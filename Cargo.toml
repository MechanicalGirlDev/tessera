[workspace]
resolver = "2"
members = [
    "crates/tessera-physics",
    "crates/tessera-mpm",
    "crates/tessera-python3d",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
authors = ["nop <noplab90@gmail.com>"]
repository = "https://github.com/MechanicalGirlDev/tessera"

[workspace.dependencies]
nalgebra = "0.30"
thiserror = "2"
urdf-rs = "0.9"
tokio = { version = "1", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tessera-physics]
opt-level = 3

[profile.dev.package.tessera-mpm]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
